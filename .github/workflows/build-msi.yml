name: Build and release community MSI

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing private tag to build (for example v7.7.0)'
        required: true
        default: v7.7.0
        type: string

permissions:
  contents: read

concurrency:
  group: community-msi-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  VERSION_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  POWERSHELL_TELEMETRY_OPTOUT: '1'
  PS_RELEASE_BUILD: '1'

jobs:
  build:
    name: Build x64 MSI using the original WiX pipeline
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check out the private version tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERSION_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the version tag and record the source commit
        id: source
        shell: pwsh
        run: |
          if ($env:VERSION_TAG -notmatch '^v\d+\.\d+\.\d+(-(preview|rc)\.\d+)?$') {
            throw "Unsupported release tag: $env:VERSION_TAG"
          }
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - name: Install the exact SDK specified by the checked-out source
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build and package
        shell: pwsh
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages
          SYSTEM_ARTIFACTSDIRECTORY: ${{ github.workspace }}/artifacts/build-diagnostics
        run: |
          ./tools/msi-build/Build-Msi.ps1 -VersionTag $env:VERSION_TAG -OutputDirectory ./artifacts
      - name: Save the MSI and reproducibility records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-package-${{ env.VERSION_TAG }}
          path: |
            artifacts/*.msi
            artifacts/*.json
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Save build diagnostics even when compilation fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-build-logs-${{ env.VERSION_TAG }}
          path: |
            artifacts/*.log
            artifacts/build-diagnostics/**
          if-no-files-found: warn
          retention-days: 7

  verify:
    name: Verify metadata, payload, installation and uninstallation
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        # The original UpgradeCode can replace the runner's PowerShell 7 MSI.
        # Windows PowerShell 5.1 avoids locking or removing the active shell.
        shell: powershell
    steps:
      - name: Check out the exact commit that produced the package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - name: Download the candidate MSI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msi-package-${{ env.VERSION_TAG }}
          path: artifacts
      - name: Install, test and uninstall on an expendable runner
        run: |
          ./tools/msi-build/Test-Msi.ps1 -VersionTag $env:VERSION_TAG -ArtifactDirectory ./artifacts
      - name: Save validation records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-validation-${{ env.VERSION_TAG }}
          path: |
            artifacts/installation-test.json
            artifacts/msi-install.log
            artifacts/msi-uninstall.log
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish only the verified MSI
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check that the private tag has not moved during the build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERSION_TAG }}
          persist-credentials: false
      - name: Verify release provenance
        shell: bash
        env:
          BUILT_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BUILT_COMMIT"
      - name: Download the verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msi-package-${{ env.VERSION_TAG }}
          path: artifacts
      - name: Download installation validation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msi-validation-${{ env.VERSION_TAG }}
          path: artifacts/validation
      - name: Create or update the private release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${VERSION_TAG#v}"
          cd artifacts
          sha256sum -c SHA256SUMS
          test -s "PowerShell-${version}-win-x64.msi"
          test -s validation/installation-test.json
          cat > release-notes.md <<EOF
          Community-built PowerShell ${version} x64 MSI, compiled from the tagged source.

          This is NOT a Microsoft-published or Microsoft-signed installer. It restores
          the original PowerShell v7.6.0 WiX/MSI pipeline and retains its installer
          options and UpgradeCode, so it can replace an existing official PowerShell 7 MSI.
          Microsoft Update is NOT an update channel for this community MSI.

          Gates passed: x64 MSI metadata, embedded version, SHA-256 payload comparison,
          actual quiet installation, module import and actual uninstallation on a Windows runner.
          See provenance.json, payload-sha256.json and installation-test.json.

          Re-run this workflow for the same tag to replace its assets, or rebase the
          build commit onto a new upstream version and push a new private version tag.
          EOF
          prerelease=()
          if [[ "$version" == *-* ]]; then prerelease=(--prerelease); fi
          if ! gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release create "$VERSION_TAG" --verify-tag --draft \
              --title "PowerShell ${version} x64 (community MSI)" \
              --notes-file release-notes.md "${prerelease[@]}"
          fi
          gh release upload "$VERSION_TAG" --clobber \
            "PowerShell-${version}-win-x64.msi" SHA256SUMS provenance.json \
            payload-sha256.json windows-bom.json validation/installation-test.json
          gh release edit "$VERSION_TAG" --draft=false \
            --notes-file release-notes.md "${prerelease[@]}"
