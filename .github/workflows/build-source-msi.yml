name: Source build to MSI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Source tag; empty selects the latest supported tag in this repository'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: community-msi-publication
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  POWERSHELL_TELEMETRY_OPTOUT: '1'
  PS_RELEASE_BUILD: '1'
  GH_REPO: ${{ github.repository }}

jobs:
  resolve:
    name: Pin source tag and automation commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_tag: ${{ steps.resolve.outputs.version_tag }}
      commit: ${{ steps.resolve.outputs.commit }}
      source_commit: ${{ steps.resolve.outputs.source_commit }}
      private_tag_commit: ${{ steps.resolve.outputs.private_tag_commit }}
    steps:
      - name: Check out the automation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the private source tag
        id: resolve
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.tag }}
        run: ./tools/msi-build/Resolve-SourceTag.ps1 -VersionTag $env:SOURCE_TAG -OutputPath ./resolved/source-build.json
      - name: Save the immutable source selection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-build-selection
          path: resolved/source-build.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: Compile x64 source and package with WiX
    needs: resolve
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out the resolved automation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Check out the pinned application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source_commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Download the source selection
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-build-selection
          path: resolved
      - name: Install the SDK required by the source
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: source/global.json
      - name: Compile and package
        shell: pwsh
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages
          SYSTEM_ARTIFACTSDIRECTORY: ${{ github.workspace }}/artifacts/build-diagnostics
        run: ./tools/msi-build/Build-SourceMsi.ps1 -SourceBuildPath ./resolved/source-build.json -SourceDirectory ./source -OutputDirectory ./artifacts
      - name: Save the MSI and build records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-package-${{ needs.resolve.outputs.version_tag }}
          path: |
            artifacts/*.msi
            artifacts/*.json
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-build-logs-${{ needs.resolve.outputs.version_tag }}
          path: |
            artifacts/*.log
            artifacts/build-diagnostics/**
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish source-built MSI
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the packaging scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Download the MSI and build records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msi-package-${{ needs.resolve.outputs.version_tag }}
          path: artifacts
      - name: Create or replace the versioned release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ needs.resolve.outputs.version_tag }}
          BUILT_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          AUTOMATION_COMMIT: ${{ needs.resolve.outputs.commit }}
          TAG_COMMIT_AT_START: ${{ needs.resolve.outputs.private_tag_commit }}
          PACKAGING_MODE: SourceBuild
        run: bash ./tools/msi-build/Publish-MsiRelease.sh
